services:
  expo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    init: true
    stdin_open: true
    tty: true
    env_file:
      - ../.env
    environment:
      EXPO_PORT: ${EXPO_PORT:-8082}
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      EXPO_PUBLIC_BACKGROUND_REMOVAL_PROVIDER: ${EXPO_PUBLIC_BACKGROUND_REMOVAL_PROVIDER:-rembg}
      EXPO_PUBLIC_CLOTHING_CATEGORIZATION_PROVIDER: ${EXPO_PUBLIC_CLOTHING_CATEGORIZATION_PROVIDER:-ollama}
      EXPO_PUBLIC_OLLAMA_MODEL: ${EXPO_PUBLIC_OLLAMA_MODEL:-qwen3-vl:4b}
      EXPO_PUBLIC_OLLAMA_BASE_URL: ${EXPO_PUBLIC_OLLAMA_BASE_URL:-}
      EXPO_PUBLIC_REMBG_BASE_URL: ${EXPO_PUBLIC_REMBG_BASE_URL:-}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    ports:
      - "${EXPO_PORT:-8082}:${EXPO_PORT:-8082}"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/sh", "/app/docker/expo-entrypoint.sh"]

  rembg:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rembg
    profiles: ["rembg-sidecar"]
    restart: unless-stopped
    init: true
    environment:
      REMBG_PORT: ${REMBG_PORT:-7001}
      U2NET_HOME: /models
    ports:
      - "${REMBG_PORT:-7001}:${REMBG_PORT:-7001}"
    volumes:
      - rembg_models:/models

  ollama-probe:
    image: curlimages/curl:8.12.1
    profiles: ["probe"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      curl -fsS http://host.docker.internal:11434/api/tags >/dev/null &&
      curl -fsS http://host.docker.internal:11434/v1/models | grep -q '"qwen3-vl:4b"' &&
      echo 'Ollama reachable from container via host.docker.internal:11434'

  rembg-probe:
    image: curlimages/curl:8.12.1
    profiles: ["probe", "rembg-sidecar"]
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      code="$$(curl -s -o /dev/null -w '%{http_code}' http://host.docker.internal:${REMBG_PORT:-7001}/api/remove || true)" &&
      ([ "$$code" = "405" ] || [ "$$code" = "422" ]) &&
      echo "rembg reachable from container via host.docker.internal:${REMBG_PORT:-7001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  rembg_models:
